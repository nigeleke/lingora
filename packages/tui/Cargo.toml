[package]
name        = "lingora-tui"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
authors     = { workspace = true }
repository  = { workspace = true }
homepage    = { workspace = true }
description = """
Lingora is a free and open-source localization management program that analyses
fluent translation files highlighting discrepancies between reference and target
languages. This application provides a terminal user interface; run as `lingora-tui`.
"""

[dependencies]
clap            = { workspace = true, features = ["derive", "color"] }
crossterm       = { workspace = true }
directories     = { workspace = true }
fluent4rs       = { workspace = true, default-features = false }
lingora-core    = { workspace = true }
rat-event       = { workspace = true }
rat-focus       = { workspace = true }
rat-text        = { workspace = true }
ratatui         = { workspace = true }
ratatui-themes  = { workspace = true, features = ["widgets"] }
serde           = { workspace = true, features = ["derive"] }
strum           = { workspace = true, features = ["derive"] }
termbg          = { workspace = true }
thiserror       = { workspace = true }
toml            = { workspace = true }
tui-tree-widget = { workspace = true }
