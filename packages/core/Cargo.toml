[package]
name        = "lingora-core"
version     = { workspace = true }
edition     = { workspace = true }
license     = { workspace = true }
authors     = { workspace = true }
repository  = { workspace = true }
homepage    = { workspace = true }
description = """
Core code for lingora-cli and lingora-tui.
"""

[dependencies]
clap            = { workspace = true, features = ["derive", "color"] }
fluent4rs       = { workspace = true, features = ["parser-chumsky", "hash", "walker"] }
futures         = { workspace = true }
icu_locale_core = { workspace = true, features = ["alloc", "serde"] }
path-clean      = { workspace = true }
proc-macro2     = { workspace = true }
quote           = { workspace = true }
rayon           = { workspace = true }
regex           = { workspace = true }
serde           = { workspace = true, features = ["derive"] }
syn             = { workspace = true, features = ["full", "visit"] }
sys-locale      = { workspace = true }
thiserror       = { workspace = true }
toml            = { workspace = true }
walkdir         = { workspace = true }

[dev-dependencies]
criterion         = { workspace = true, features = ["html_reports"] }
insta             = { workspace = true, features = ["filters"] }
pretty_assertions = { workspace = true }
tempfile          = { workspace = true }

[[bench]]
name    = "rayon"
harness = false
