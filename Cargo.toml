[workspace]
resolver = "2"
members = [
    "packages/core",
    "packages/cli",
    "packages/tui",
]

[workspace.package]
version = "0.4.17-alpha"
edition = "2024"
license = "BSD-3-Clause"
authors = ["Nigel Eke"]
repository = "https://github.com/nigeleke/lingora"
homepage = "https://nigeleke.github.io/lingora"

[workspace.dependencies]
clap              = "4.0.0"
criterion         = "0.8.0"
crossterm         = "0.29.0"
directories       = "6.0.0"
fluent4rs         = "2.3.0"
futures           = "0.3.0"
icu_locale_core   = "2.1.0"
insta             = "1.46.0"
path-clean        = "1.0.0"
pretty_assertions = "1.4.0"
proc-macro2       = "1.0.0"
quote             = "1.0.0"
rat-event         = "2.0.0"
rat-focus         = "2.0.0"
rat-text          = "3.0.0"
ratatui           = "0.30.0"
ratatui-themes    = "0.4.0"
rayon             = "1.12.0"
regex             = "1.12.0"
serde             = "1.0.0"
strum             = "0.28.0"
syn               = "3.0.0"
sys-locale        = "0.3.0"
tempfile          = "3.24.0"
termbg            = "0.6.0"
thiserror         = "2.0.0"
toml              = "1.0.0"
tui-tree-widget   = "0.24.0"
walkdir           = "2.5.0"
lingora-core      = { version = "0.4.17-alpha", path = "packages/core" }
