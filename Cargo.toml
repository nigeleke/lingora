[workspace]
resolver = "2"
members = [
    "packages/core",
    "packages/cli",
    "packages/tui",
]

[workspace.package]
version = "0.4.17-alpha"
edition = "2024"
license = "BSD-3-Clause"
authors = ["Nigel Eke"]
repository = "https://github.com/nigeleke/lingora"
homepage = "https://nigeleke.github.io/lingora"

[workspace.dependencies]
clap              = "4.6.9"
criterion         = "0.8.2"
crossterm         = "0.29.0"
directories       = "6.0.0"
fluent4rs         = "2.3.1"
futures           = "0.3.34"
icu_locale_core   = "2.4.0"
insta             = "1.49.0"
path-clean        = "1.0.1"
pretty_assertions = "1.4.1"
proc-macro2       = "1.0.107"
quote             = "1.0.47"
rat-event         = "2.1.2"
rat-focus         = "2.2.1"
rat-text          = "3.1.5"
ratatui           = "0.30.2"
ratatui-themes    = "0.4.0"
rayon             = "1.12.0"
regex             = "1.13.2"
serde             = "1.0.229"
strum             = "0.28.0"
syn               = "3.0.10"
sys-locale        = "0.3.2"
tempfile          = "3.27.0"
termbg            = "0.6.2"
thiserror         = "2.0.21"
toml              = "1.2.2+spec-1.1.0"
tui-tree-widget   = "0.24.1"
walkdir           = "2.5.1"
lingora-core      = { version = "0.4.17-alpha", path = "packages/core" }
